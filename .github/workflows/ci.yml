name: CI · Validate package
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify package artifacts
        run: |
          test -f dist/focus-trap-vue.esm.js
          test -f dist/focus-trap-vue.cjs.js
          test -f dist/index.d.ts
